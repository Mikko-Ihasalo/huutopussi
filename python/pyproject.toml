[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "huutopussi-rl"
version = "0.1.0"
description = "Reinforcement learning and data analysis tools for the Huutopussi Godot game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0,<2.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "matplotlib>=3.9,<4.0",
    "pyarrow>=18.0,<20.0",
    "seaborn>=0.13,<1.0",
    
]

[project.optional-dependencies]
rl = [
    "stable-baselines3>=2.4,<3.0",
    "torch>=2.5,<3.0",
]
analysis = [
    "matplotlib>=3.9,<4.0",
    "pyarrow>=18.0,<20.0",
    "seaborn>=0.13,<1.0",
]
dev = [
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
]
all = [
    "huutopussi-rl[analysis,dev,rl]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["huutopussi_rl"]
